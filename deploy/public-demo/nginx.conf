worker_processes 1;
pid /root/robomark/run/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    include /www/server/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_body_temp_path /root/robomark/run/client_temp;
    proxy_temp_path /root/robomark/run/proxy_temp;
    limit_req_zone $binary_remote_addr zone=demo_api:1m rate=20r/s;
    server {
        listen 12345;
        server_name robomark.lijie.space;
        root /root/robomark/frontend;
        client_max_body_size 10m;
        add_header X-Content-Type-Options nosniff always;
        location = /api/auth/register { return 403; }
        # Public visitors can inspect saved inference results and review candidates.
        # Network calls and new inference work are reserved for local administration.
        location ~ ^/api/preannotation/profiles(?:/.*)?$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:18000;
            include /root/robomark/app/deploy/public-demo/proxy-headers.conf;
        }
        location ~ ^/api/datasets/[0-9]+/preannotation-tasks$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:18000;
            include /root/robomark/app/deploy/public-demo/proxy-headers.conf;
        }
        location ~ ^/api/preannotation/tasks/[0-9]+/(?:retry-failed|cancel|images/[0-9]+/retry)$ { return 403; }
        location /api/ {
            limit_req zone=demo_api burst=60 nodelay;
            proxy_pass http://127.0.0.1:18000;
            include /root/robomark/app/deploy/public-demo/proxy-headers.conf;
            proxy_read_timeout 120s;
        }
        location /assets/ {
            try_files $uri =404;
            expires 7d;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
